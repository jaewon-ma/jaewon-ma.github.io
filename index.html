<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CPSC 581 Project 1: A Family of Buttons</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="button-row">
    <button class="sewing-machine-button" id="sewingBtn"></button>

    <button class="lamp-button" id="lampBtn">
            <img id="lampImg" src="images/lamp-100-on.png" alt="Lamp">
        </button>

    <button class="weight-button" id="weightBtn">
        <video id="weightVideo" muted playsinline>
            <source src="images/weightlifter1.mp4" type="video/mp4">
        </video>
    </button>
</div>

<script src="script.js"></script>

</body>

</html>
